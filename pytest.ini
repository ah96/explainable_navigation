[pytest]
# One list for a checkout that is run without installing: the tests of every
# package import the sources below. Under `colcon test` the installed packages
# are found as well, and they hold the same code.
pythonpath = nav_explain_core nav_explain_costmap nav_explain_semantic nav_explain_hixron nav_explain_perception nav_explain_bringup
testpaths = nav_explain_core nav_explain_costmap nav_explain_semantic nav_explain_hixron nav_explain_perception
addopts = -q
